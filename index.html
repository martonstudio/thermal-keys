<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal Keys – WebGL recreation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0a12; color: #e8e8f0; font-family: "Outfit", system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px; max-width: 1200px; margin: 0 auto; }

  /* ---------- stage ---------- */
  #stage { position: relative; width: 100%; margin: 0 auto; aspect-ratio: 16 / 9; overflow: hidden; --u: 1cqw; background: #2b22d6; border-radius: 6px; container-type: inline-size; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: filter, transform; }
  #overlay { position: absolute; inset: 0; pointer-events: none; color: #fff; font-weight: 700; text-transform: uppercase; line-height: 1; }
  #overlay .ch { display: inline-block; white-space: pre; will-change: transform, opacity; }
  #overlay .wd { display: inline-block; white-space: pre; }
  #overlay .wd.slant { transform: skewX(-13deg); transform-origin: 50% 100%; }
  #lockup { position: absolute; right: 7.6%; top: 8.2%; white-space: nowrap; font-size: calc(var(--u) * 2.55); line-height: .92; text-align: left; letter-spacing: -.01em; }
  #headline { position: absolute; left: 8.6%; top: 25.5%; }
  #kicker { font-size: calc(var(--u) * 1.45); letter-spacing: .04em; margin: 0 0 calc(var(--u) * .75) calc(var(--u) * .35); }
  #headline .line { font-size: calc(var(--u) * 3.15); line-height: 1.17; letter-spacing: .012em; white-space: nowrap; }
  #bigtitle { position: absolute; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; white-space: nowrap; font-size: calc(var(--u) * 8.2); line-height: .9; letter-spacing: -.012em; }
  #logos { position: absolute; left: 50%; display: flex; align-items: center; gap: calc(var(--u) * 1.3); transform: translate(-50%, -50%); height: calc(var(--u) * 6); }
  #logos img { height: 100%; width: auto; display: block; }
  #logos .div { width: 1px; align-self: stretch; background: rgba(255,255,255,.85); }
  #logos.empty { display: none; }

  /* ---------- transport ---------- */
  #transport { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  #transport button { background: #1b1b2a; color: #fff; border: 1px solid #34344a; border-radius: 6px; padding: 9px 12px; min-height: 38px; font: 600 13px "Outfit", system-ui, sans-serif; cursor: pointer; }
    #custom { touch-action: none; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
  #transport button:active, #transport button.on { background: #2b22d6; border-color: #6f7bff; }
  #bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; height: 22px; }
  #play { flex: none; width: 22px; height: 22px; padding: 0; border: 0; background: none; color: #fff; cursor: pointer; display: grid; place-items: center; opacity: .85; }
  #play svg { width: 12px; height: 12px; fill: currentColor; display: block; }
  #scrub { flex: 1; min-width: 0; height: 22px; margin: 0; background: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
  #scrub::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(#ffe01f, #ffe01f) 0 / var(--done, 0%) 100% no-repeat, #34344a; }
  #scrub::-moz-range-track { height: 3px; border-radius: 2px; background: #34344a; }
  #scrub::-moz-range-progress { height: 3px; border-radius: 2px; background: #ffe01f; }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -4px; border-radius: 50%; background: #ffe01f; }
  #scrub::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: #ffe01f; }
  /* ---------- side panel ---------- */
  #side { min-width: 0; }
  #tabs { display: flex; gap: 2px; padding: 6px; background: #14141f; border-radius: 8px 8px 0 0; border-bottom: 1px solid #26263a; scrollbar-width: none; }
  #tabs button { flex: 1 1 0; min-width: 0; padding: 10px 0; border: 0; border-radius: 6px; background: transparent; color: #a9a9c2; font: 600 clamp(10.5px, 3vw, 13px) "Outfit", system-ui, sans-serif; cursor: pointer; }
  #tabs button[aria-selected="true"] { background: #2b22d6; color: #fff; }
  .panel { background: #14141f; padding: 6px clamp(6px, 2vw, 12px) 12px; border-radius: 0 0 8px 8px; }
  .panel[hidden] { display: none; }
  #tracks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 0 4px; }
  #tracks button { padding: 11px 2px; border: 1px solid #34344a; border-radius: 6px; background: #1b1b2a; color: #fff; font: 600 12px "Outfit", system-ui, sans-serif; cursor: pointer; }
  #tracks button.on { background: #2b22d6; border-color: #6f7bff; }
  /* Snapseed-style dials: a grid of parameter buttons, four rows deep. Press and
     hold one and drag sideways to change it; a read-out appears over the picture. */
  .dials { display: grid; grid-template-rows: repeat(4, 52px); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; padding: 8px 0 4px; }   /* every dial always fits: columns share the width, nothing scrolls off */
  .dials.grouped { grid-template-rows: none; grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 52px; margin-top: 8px; padding: 6px; border-radius: 12px; background: rgba(255,255,255,.07); }
  .dial { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; padding: 0 8px; line-height: 1.1; text-align: left; border: 1px solid #34344a; border-radius: 8px; background: #1b1b2a; color: #fff; font: 600 12px "Outfit", system-ui, sans-serif; cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .dial .v { font: 11px ui-monospace, monospace; opacity: .6; white-space: nowrap; overflow: hidden; }
  .dial .fill { position: absolute; left: 0; bottom: 0; height: 3px; background: #ffe01f; }
  .dial.active { border-color: #ffe01f; background: #23233a; }
  .dial.toggle, .dial.swatch { cursor: pointer; touch-action: manipulation; }
  .dial.toggle.on { background: #2b22d6; border-color: #6f7bff; }
  .dial.swatch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .dial.swatch .chip { position: absolute; right: 8px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; border: 1px solid #fff8; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; padding-top: 8px; }
  .fields label { display: block; font-size: 11px; opacity: .65; margin-bottom: 2px; }
  .fields input { width: 100%; min-width: 0; background: #0a0a12; color: #fff; border: 1px solid #34344a; border-radius: 6px; padding: 8px; font: 500 13px "Outfit", system-ui, sans-serif; }
  #hud { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); width: min(72%, 320px); padding: 8px 12px 10px; border-radius: 10px; background: rgba(10,10,18,.72); color: #fff; font: 600 13px "Outfit", system-ui, sans-serif; text-transform: none; pointer-events: none; opacity: 0; transition: opacity .12s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud.show { opacity: 1; }
  #hud .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #hud .val { font: 12px ui-monospace, monospace; }
  #hud .track { height: 4px; border-radius: 2px; background: #ffffff33; }
  #hud .bar { height: 100%; border-radius: 2px; background: #ffe01f; }
  #foot { display: flex; justify-content: center; padding: 12px 0 4px; }
  #foot button { background: #1b1b2a; color: #fff; border: 1px solid #34344a; border-radius: 6px; padding: 10px 28px; font: 600 13px "Outfit", system-ui, sans-serif; cursor: pointer; }
  #extras { padding-top: 8px; font-size: 13px; }
  #extras label { display: block; margin: 6px 0 3px; opacity: .8; }
  #extras input[type=file] { width: 100%; font-size: 12px; color: #aaa; }
  #extras button { background: #1b1b2a; color: #fff; border: 1px solid #34344a; border-radius: 6px; padding: 7px 10px; font: 600 12px "Outfit", system-ui, sans-serif; cursor: pointer; margin: 8px 6px 0 0; }
  #dump { width: 100%; height: 90px; margin-top: 8px; background: #0a0a12; color: #9fd; border: 1px solid #26263a; font: 11px ui-monospace, monospace; display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="hud" aria-hidden="true"><div class="top"><span class="name"></span><span class="val"></span></div><div class="track"><div class="bar"></div></div></div>
      <div id="overlay">
        <div id="lockup"></div>
        <div id="headline"><div id="kicker"></div><div id="lines"></div></div>
        <div id="bigtitle"></div>
        <div id="logos" class="empty"><img id="logoA" alt="" hidden><span class="div" hidden></span><img id="logoB" alt="" hidden></div>
      </div>
    </div>
    <div id="bar">
      <button id="play" aria-label="Pause"></button>
      <input id="scrub" type="range" min="0" max="14" step="0.01" value="0" aria-label="Timeline">
    </div>
    <div id="transport">
      <button data-aspect="16:9">16:9</button>
      <button data-aspect="9:16">9:16</button>
      <button data-aspect="4:5">4:5</button>
      <button data-aspect="custom" id="custom" title="Hold and drag to set the width">Custom</button>
    </div>
  </div>
  <div id="side">
    <div id="tabs" role="tablist"></div>
    <div id="panels"></div>
    <div id="foot"><button id="reset" title="Put every setting back to its default">Reset</button></div>
    <div id="extras">
      <label for="fileA">Left logo</label><input id="fileA" type="file" accept="image/*">
      <label for="fileB">Right logo</label><input id="fileB" type="file" accept="image/*">
      <div>
        <button id="clearLogos">Clear logos</button>
        <button id="copy">Copy settings</button>
      </div>
      <textarea id="dump" readonly></textarea>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* =====================================================================
   1. SETTINGS  – every value here is live-editable from the panel
   ===================================================================== */

const DEFAULTS = {
  // playback + format
  speed: 1, loopLength: 14, shots: 4, aspect: "16:9", customRatio: 16 / 9, music: "ambient", volume: 0.7,
  // colour: one hue slider turns the whole ramp; the ramp itself (cold -> hot) lives here
  hue: 0,
  c0: "#7fa9b3", c1: "#2a22d8", c2: "#7d98ff", c3: "#e8f0ff", c4: "#ffe01f", c5: "#ff8d1c", c6: "#e23a1c",
  // backdrop
  bgScale: 0.7, bgContrast: 0.72, bgHeat: 0.0, heatAnim: 1.0, bgFlow: 1, bgWarp: 0.4,
  // keycaps
  keyOpacity: 0.95, keyPattern: 0.3, keyNormal: 0.3, keyContrast: 0.6, keyHeat: 0.1, keyTopHeat: 0.9,
  edgeStrength: 0.9, rimStrength: 0.7, edgeColor: "#f3ecff", legendOpacity: 0.95,
  // motion
  burstHeight: 2.6, burstShare: 0.42, tumble: 1.0, floatDrift: 1.0, floatScale: 1.0, blur: 2.2, fov: 34,
  // type
  kicker: "Human creativity meets A.I.",
  line1: "The world's first", line2: "AI creative", line3: "championship",
  title1: "AI creative", title2: "challenge",
  textColor: "#ffffff", textScale: 1.0, weight: 800, slantAI: true, typeSpeed: 1.0, showText: true,
};
const P = Object.assign({}, DEFAULTS);

/* Floating-key layouts. at = position on screen (-1..1 across, -1..1 up), so a
   layout follows any aspect ratio. rot is Euler radians. */
const FLOAT_SETS = [
  [ { legend: "A",     w: 1,    at: [-0.89,  0.65], scale: 1.6,  rot: [1.0,   0.3,   0.10], delay: 0.45 },
    { legend: "I",     w: 1,    at: [-0.51,  0.56], scale: 1.35, rot: [1.05, -0.35, -0.22], delay: 0.30 },
    { legend: "",      w: 1,    at: [-0.01,  0.26], scale: 0.85, rot: [0.9,  -0.6,   0.25], delay: 0.55 },
    { legend: "G",     w: 1,    at: [ 0.17, -0.11], scale: 1.25, rot: [0.9,   0.25, -0.12], delay: 0.20 },
    { legend: "✦",w: 1.25, at: [-0.63, -0.28], scale: 1.5,  rot: [0.5,  -0.55,  0.05], delay: 0.00 },
    { legend: "Enter", w: 2.25, at: [ 0.68, -0.39], scale: 2.0,  rot: [1.2,  -0.25,  0.28], delay: 0.85 } ],
  [ { legend: "Shift", w: 2.25, at: [-0.60, -0.50], scale: 1.75, rot: [1.15,  0.35, -0.25], delay: 0.00 },
    { legend: "Q",     w: 1,    at: [ 0.80,  0.58], scale: 1.6,  rot: [0.95, -0.40,  0.15], delay: 0.35 },
    { legend: "W",     w: 1,    at: [ 0.42,  0.16], scale: 1.15, rot: [1.1,   0.30, -0.10], delay: 0.20 },
    { legend: "",      w: 1,    at: [ 0.08, -0.55], scale: 0.8,  rot: [0.8,  -0.50,  0.30], delay: 0.50 },
    { legend: "E",     w: 1,    at: [ 0.16,  0.70], scale: 0.95, rot: [1.0,   0.55,  0.20], delay: 0.60 },
    { legend: "R",     w: 1,    at: [ 0.74, -0.38], scale: 1.4,  rot: [0.7,  -0.30, -0.18], delay: 0.75 } ],
  [ { legend: "✦",w: 1.25, at: [-0.74,  0.52], scale: 1.9,  rot: [0.9,   0.45,  0.12], delay: 0.00 },
    { legend: "Enter", w: 2.25, at: [ 0.66, -0.60], scale: 1.7,  rot: [1.15, -0.30,  0.22], delay: 0.30 },
    { legend: "A",     w: 1,    at: [ 0.80,  0.56], scale: 1.35, rot: [1.0,  -0.45, -0.15], delay: 0.45 },
    { legend: "I",     w: 1,    at: [-0.78, -0.52], scale: 1.45, rot: [0.75,  0.35, -0.20], delay: 0.15 },
    { legend: "",      w: 1,    at: [ 0.02, -0.82], scale: 0.9,  rot: [0.9,  -0.60,  0.30], delay: 0.60 } ],
];

/* Shot library. Each shot is a recipe; the sequence is assembled automatically.
   len   = authored seconds
   text  = "headline" (kicker + three lines) or "title" (big centred title)
   cam   = camera move from -> to. Either polar round the keyboard
           { az: degrees (0 = dead front), r: distance, h: height, look: aim point }
           or plain { p: position, q: aim point }. ease > 1 = quick start, slow finish.
           A move only ever travels one way, so it can never double back.
   burst = [from, to] how far the keys have lifted (0 seated, 1 fully burst)
   ripple= a wave of lifting keys sweeps the board
   blur  = [from, to] soft-focus amount (fraction of the Blur dial)
   float = which floating-key layout to show instead of the keyboard
   heat  = [[seconds, backdrop heat], ...] */
const BURST_CAM = { az: -17, r: 5.46, h: 1.7, look: [1.2, 0.76, 0.03] };
const SHOTS = {
  burst:   { len: 3.0, text: "headline", burst: [0.34, 1], heat: [[0, -.1], [3, -.1]],
             cam: { from: BURST_CAM, to: { az: -13, r: 5.0, h: 1.3, look: [1.3, 0.7, 0] } } },
  float:   { len: 6.2, text: "headline", float: 0, heat: [[0, .34], [.6, -.1], [2.6, -.1], [3.4, .12], [4.6, .3], [5.8, .34], [6.2, .3]] },
  macro:   { len: 3.0, text: "headline", burst: [0, 0.22], heat: [[0, .02], [3, .26]],
             cam: { from: { p: [-6.6, 0.85, 1.9], q: [-3.4, 0.45, 0] }, to: { p: [-2.4, 0.95, 1.5], q: [0.8, 0.45, -0.3] } } },
  float2:  { len: 4.0, text: "headline", float: 1, heat: [[0, .3], [.6, -.02], [4, .22]] },
  side:    { len: 3.0, text: "headline", burst: [0.1, 0.62], heat: [[0, -.1], [3, .12]],
             cam: { from: { az: 82, r: 9.6, h: 1.8, look: [0, 0.8, 0] }, to: { az: 60, r: 7.4, h: 1.3, look: [0, 0.8, 0] } } },
  top:     { len: 2.2, text: "title", burst: [0, 0], blur: [1, 0.35], fadeIn: [0.75, 1.3], heat: [[0, .2], [2.2, .24]],
             cam: { from: { p: [-0.6, 10.5, 2.2], q: [-0.6, 0, 0] }, to: { p: [0.5, 5.2, 1.4], q: [0.5, 0, -0.2] } } },
  ripple:  { len: 3.0, text: "title", burst: [0, 0], ripple: 1, heat: [[0, .08], [3, .3]],
             cam: { from: { az: 40, r: 10.2, h: 6.6, look: [0, 1.6, 0] }, to: { az: 22, r: 8.8, h: 5.4, look: [0, 1.6, 0] } } },
  float3:  { len: 3.5, text: "title", float: 2, heat: [[0, .3], [.6, .04], [3.5, .26]] },
  flyover: { len: 3.0, text: "title", burst: [0, 0.3], heat: [[0, 0], [3, .22]],
             cam: { from: { p: [0, 2.6, 8.4], q: [0, 0.9, 1.4] }, to: { p: [0, 1.6, 2.6], q: [0, 1.2, -4.5] } } },
  orbit:   { len: 2.5, text: "title", burst: [0, 0.34], heat: [[0, .24], [1.2, -.02], [2.5, -.1]],
             cam: { from: { az: -64, r: 10.2, h: 6.6, look: [0.2, 1.5, 0.2] }, to: BURST_CAM, ease: 2.2 } },
};
/* Which shots play for a given count. Headline shots lead, title shots follow, and
   the orbit always closes the loop because it glides straight back into the burst. */
const HEADLINE_ORDER = ["burst", "float", "macro", "float2", "side"];
const TITLE_ORDER = ["orbit", "top", "ripple", "float3", "flyover"];
function buildSequence(n) {
  n = clamp(Math.round(n), 1, 10);
  const nH = Math.ceil(n / 2), tail = TITLE_ORDER.slice(0, n - nH);
  const names = HEADLINE_ORDER.slice(0, nH).concat(tail.slice(1), tail.slice(0, 1));
  let at = 0, titleAt = Infinity;
  const shots = names.map(name => { const def = SHOTS[name], sh = { name, def, start: at }; if (def.text === "title" && titleAt === Infinity) titleAt = at; at += def.len; return sh; });
  return { n, shots, total: at, titleAt };
}
let SEQ = null;                             // the assembled sequence, built once the helpers below exist

/* Keyboard rows: [legend, width in key units]. "" with a width is a gap. */
const ROWS = [
  { z: -3.2, keys: [["Esc",1],["_",1],["F1",1],["F2",1],["F3",1],["F4",1],["_",.5],["F5",1],["F6",1],["F7",1],["F8",1],["_",.5],["F9",1],["F10",1],["F11",1],["F12",1]] },
  { z: -2, keys: [["`",1],["1",1],["2",1],["3",1],["4",1],["5",1],["6",1],["7",1],["8",1],["9",1],["0",1],["-",1],["=",1],["Back",2]] },
  { z: -1, keys: [["Tab",1.5],["Q",1],["W",1],["E",1],["R",1],["T",1],["Y",1],["U",1],["I",1],["O",1],["P",1],["[",1],["]",1],["\\",1.5]] },
  { z: 0,  keys: [["Caps Lock",1.75],["A",1],["S",1],["D",1],["F",1],["G",1],["H",1],["J",1],["K",1],["L",1],[";",1],["'",1],["Enter",2.25]] },
  { z: 1,  keys: [["Shift",2.25],["Z",1],["X",1],["C",1],["V",1],["B",1],["N",1],["M",1],[",",1],[".",1],["/",1],["Shift",2.75]] },
  { z: 2,  keys: [["Ctrl",1.25],["Fn",1.25],["Alt",1.25],["",6.25],["Alt",1.25],["Fn",1.25],["Menu",1.25],["Ctrl",1.25]] },
];

/* =====================================================================
   2. SMALL HELPERS
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const ramp = (t, a, b) => smooth((t - a) / (b - a));           // 0 -> 1 between a and b
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 2.2);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function keyed(keys, t) { // piecewise-smooth lookup in [[time,value],...]
  for (let i = 0; i < keys.length - 1; i++) { const a = keys[i], b = keys[i + 1]; if (t <= b[0]) return lerp(a[1], b[1], smooth((t - a[0]) / Math.max(1e-6, b[0] - a[0]))); }
  return keys[keys.length - 1][1];
}
SEQ = buildSequence(DEFAULTS.shots);

/* =====================================================================
   3. SHADERS
   ===================================================================== */
const GLSL_COMMON = `
  uniform vec3 uCol[7];
  uniform float uPhase;   // 0..2PI over one loop, so everything loops cleanly
  uniform float uWarp;
  vec3 heatRamp(float v){
    v = clamp(v, 0.0, 1.0);
    vec3 c = uCol[0];
    c = mix(c, uCol[1], smoothstep(0.00, 0.20, v));
    c = mix(c, uCol[2], smoothstep(0.20, 0.40, v));
    c = mix(c, uCol[3], smoothstep(0.40, 0.54, v));
    c = mix(c, uCol[4], smoothstep(0.54, 0.66, v));
    c = mix(c, uCol[5], smoothstep(0.66, 0.84, v));
    c = mix(c, uCol[6], smoothstep(0.84, 1.00, v));
    return c;
  }
  // smooth flowing scalar field, roughly 0..1
  float field(vec2 p, float ph){
    vec2 q = p;
    q += uWarp * vec2(sin(q.y * 1.3 + ph), cos(q.x * 1.1 - ph));
    q += uWarp * 0.6 * vec2(sin(q.y * 2.1 - 2.0 * ph + 1.7), cos(q.x * 2.3 + ph + 0.6));
    float v = sin(q.x * 1.2 + ph) + sin(q.y * 1.5 - ph + 0.8)
            + sin((q.x + q.y) * 0.8 + 2.0 * ph)
            + sin(length(q - 1.2 * vec2(cos(ph), sin(ph))) * 1.7 - ph);
    return v * 0.125 + 0.5;

`;

const BG_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }`;
const BG_FRAG = `
  precision highp float;
  varying vec2 vUv;
  uniform float uAspect, uScale, uContrast, uHeat;
  ${GLSL_COMMON}
  void main(){
    vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0) * uScale * 2.4 + vec2(3.1, 1.7);
    float f = field(p, uPhase);
    float v = (f - 0.5) * uContrast * 1.6 + 0.3 + uHeat;
    gl_FragColor = vec4(heatRamp(v), 1.0);
  }
`;

const KEY_VERT = `
  attribute vec3 aN0;                 // un-tapered normal, used to find bevel edges
  varying vec3 vN0, vNw, vWp, vOp;
  void main(){
    vN0 = aN0; vOp = position;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWp = wp.xyz;
    vNw = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;
const KEY_FRAG = `
  precision highp float;
  varying vec3 vN0, vNw, vWp, vOp;
  uniform float uAlpha, uOpacity, uPattern, uNormalInf, uContrast, uHeat, uTopHeat, uEdge, uRim, uLegendOp, uSeed, uDepth;
  uniform vec3 uHalf;                 // half size of this key

  uniform sampler2D uAtlas;
  uniform vec4 uLegend;               // atlas rect: x, y, w, h
  ${GLSL_COMMON}
  void main(){
    vec3 V = normalize(cameraPosition - vWp);
    vec3 N = normalize(vNw) * (gl_FrontFacing ? 1.0 : -1.0);
    float ndv = clamp(dot(N, V), 0.0, 1.0);
    vec3 Nv = normalize((viewMatrix * vec4(N, 0.0)).xyz);

    // the "thermal" value: a flowing field looked up by position and facing
    vec2 p = (vWp.xy + vWp.z * vec2(0.55, -0.35)) * uPattern + Nv.xy * uNormalInf + uSeed;
    float f = field(p, uPhase);
    // each key glows hottest at the middle of its top face and cools towards its base
    vec3 o = (vOp - vec3(0.0, uHalf.y, 0.0)) / vec3(uHalf.x, uHalf.y * 2.2, uHalf.z);
    float core = 1.0 - smoothstep(0.15, 1.9, length(o));
    float v = (f - 0.5) * uContrast + 0.3 + uHeat + uTopHeat * (core - 0.45) - (1.0 - ndv) * 0.15;
    vec3 col = heatRamp(v);

    float e = 1.0 - max(abs(vN0.x), max(abs(vN0.y), abs(vN0.z)));   // 0 on flats, >0 on bevels
    float line = smoothstep(0.17, 0.29, e) * uEdge;
    float rim = pow(1.0 - ndv, 4.0) * uRim;

    if (!gl_FrontFacing) {            // inside of the glass: body colour plus edge lines
      col = mix(col * 0.92, uEdgeCol, clamp(line * 0.8, 0.0, 1.0));
      gl_FragColor = vec4(col, uAlpha);

    }
    col = mix(col, uEdgeCol, clamp(line + rim, 0.0, 1.0));

    float leg = 0.0;                  // legend printed on the top face
    if (vN0.y > 0.92 && uLegend.z > 0.0) {
      vec2 uv = vec2(vOp.x, vOp.z) / uDepth + 0.5;
      if (uv.x > 0.0 && uv.x < 1.0 && uv.y > 0.0 && uv.y < 1.0)
        leg = texture2D(uAtlas, uLegend.xy + uv * uLegend.zw).a * uLegendOp;

    float a = mix(uOpacity, 1.0, clamp(max(line, leg), 0.0, 1.0));
    gl_FragColor = vec4(col, a * uAlpha);
  }
`;

/* =====================================================================
   4. SCENE SETUP
   ===================================================================== */
const stage = document.getElementById("stage");
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(P.fov, 16 / 9, 0.1, 200);
scene.add(camera);

const cols = Array.from({ length: 7 }, () => new THREE.Color());
const shared = {                       // uniforms shared by every material
  uCol: { value: cols }, uPhase: { value: 0 }, uWarp: { value: P.bgWarp },

const keyShared = {
  uOpacity: { value: 1 }, uPattern: { value: 1 }, uNormalInf: { value: 1 }, uContrast: { value: 1 }, uHeat: { value: 0 },
  uTopHeat: { value: 0 }, uEdge: { value: 1 }, uRim: { value: 1 }, uLegendOp: { value: 1 }, uEdgeCol: { value: new THREE.Color() },
  uAtlas: { value: null },

const boardAlpha = { value: 1 }, floatAlpha = { value: 1 };

// backdrop
const bgUniforms = Object.assign({ uAspect: { value: 16 / 9 }, uScale: { value: 1 }, uContrast: { value: 1 }, uHeat: { value: 0 } }, shared);
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ vertexShader: BG_VERT, fragmentShader: BG_FRAG, uniforms: bgUniforms, depthTest: false, depthWrite: false }));

/* ---- keycap mesh: a rounded box, tapered towards the top ---- */
const CAP = { depth: 0.9, height: 0.72, radius: 0.15, taper: 0.2, gap: 0.1 };
const geoCache = {};
function keycapGeometry(units) {
  if (geoCache[units]) return geoCache[units];
  const w = units - CAP.gap, h = CAP.height, d = CAP.depth, r = CAP.radius, S = 7;
  const g = new THREE.BoxGeometry(w, h, d, S, S, S);
  const pos = g.attributes.position, nor = g.attributes.normal, n0 = new Float32Array(pos.count * 3);
  const half = [w / 2, h / 2, d / 2], size = [w, h, d];
  const steps = [0, r / 3, 2 * r / 3, r];                    // 4 verts across each bevel
  const v = [0, 0, 0], inner = [0, 0, 0], dl = [0, 0, 0];
  for (let i = 0; i < pos.count; i++) {
    v[0] = pos.getX(i); v[1] = pos.getY(i); v[2] = pos.getZ(i);
    for (let a = 0; a < 3; a++) {                            // re-space the grid so bevels get the detail
      const k = Math.round((v[a] / size[a] + 0.5) * S);
      v[a] = k <= 3 ? -half[a] + steps[k] : half[a] - steps[S - k];
      inner[a] = clamp(v[a], -half[a] + r, half[a] - r);
      dl[a] = v[a] - inner[a];
    }
    const len = Math.hypot(dl[0], dl[1], dl[2]);
    let nx = nor.getX(i), ny = nor.getY(i), nz = nor.getZ(i);
    if (len > 1e-6) { nx = dl[0] / len; ny = dl[1] / len; nz = dl[2] / len; }
    let x = inner[0] + nx * r, y = inner[1] + ny * r, z = inner[2] + nz * r;
    if (len <= 1e-6) { x = v[0]; y = v[1]; z = v[2]; }
    n0[i * 3] = nx; n0[i * 3 + 1] = ny; n0[i * 3 + 2] = nz;
    const s = 1 - CAP.taper * (y + h / 2) / h;               // taper: top is narrower than base
    const inset = CAP.taper * d / 2;                         // same absolute inset on every side
    const sx = 1 - (inset * 2 / w) * (y + h / 2) / h;
    pos.setXYZ(i, x * sx, y, z * s);

}

/* ---- legend atlas: all key labels drawn into one canvas texture ---- */
const ATLAS = { cols: 16, rows: 8, cell: 128 };
const atlasCanvas = document.createElement("canvas");
atlasCanvas.width = ATLAS.cols * ATLAS.cell; atlasCanvas.height = ATLAS.rows * ATLAS.cell;
const atlasTex = new THREE.CanvasTexture(atlasCanvas);
atlasTex.flipY = false; atlasTex.minFilter = THREE.LinearMipmapLinearFilter; atlasTex.anisotropy = 4;
keyShared.uAtlas.value = atlasTex;
const legendIndex = new Map();
function legendRect(label) {
  if (!label) return new THREE.Vector4(0, 0, 0, 0);
  if (!legendIndex.has(label)) legendIndex.set(label, legendIndex.size);
  const i = legendIndex.get(label);
  return new THREE.Vector4((i % ATLAS.cols) / ATLAS.cols, Math.floor(i / ATLAS.cols) / ATLAS.rows, 1 / ATLAS.cols, 1 / ATLAS.rows);
}
function drawAtlas() {
  const c = atlasCanvas.getContext("2d"), s = ATLAS.cell;
  c.clearRect(0, 0, atlasCanvas.width, atlasCanvas.height);
  c.fillStyle = "#fff"; c.textAlign = "center"; c.textBaseline = "middle";
  legendIndex.forEach((i, label) => {
    const x = (i % ATLAS.cols) * s + s / 2, y = Math.floor(i / ATLAS.cols) * s + s / 2;
    const words = label.length > 1 && label !== "✦";
    c.font = `500 ${label === "✦" ? 78 : words ? (label.length > 5 ? 22 : 30) : 58}px Outfit, system-ui, sans-serif`;
    c.fillText(label, x, y + 2, s - 10);
  });

}

/* ---- key factory ---- */
function makeKey(label, units, alphaUniform, seed) {
  const uniforms = Object.assign({
    uAlpha: alphaUniform, uLegend: { value: legendRect(label) }, uSeed: { value: seed }, uDepth: { value: CAP.depth * (1 - CAP.taper) },
    uHalf: { value: new THREE.Vector3((units - CAP.gap) / 2, CAP.height / 2, CAP.depth / 2) },
  }, shared, keyShared);
  const mat = new THREE.ShaderMaterial({ vertexShader: KEY_VERT, fragmentShader: KEY_FRAG, uniforms, transparent: true, side: THREE.DoubleSide });

/* ---- keyboard ---- */
const board = new THREE.Group(); scene.add(board);
const boardKeys = [];
{
  const rand = rng(7);
  ROWS.forEach(row => {
    const total = row.keys.reduce((s, k) => s + k[1], 0);
    let x = -total / 2;
    row.keys.forEach(([label, units]) => {
      if (label !== "_") {
        const m = makeKey(label, units, boardAlpha, rand() * 0.6);
        const base = new THREE.Vector3(x + units / 2, 0, row.z);
        m.position.copy(base); board.add(m);
        const wide = units > 3;
        boardKeys.push({
          mesh: m, base, pick: rand(), thr: rand() * 0.3,
          dir: new THREE.Vector3((rand() - 0.5) * 1.3, 0.55 + rand() * 1.1, -0.25 + rand() * 1.0),
          spin: new THREE.Vector3((rand() - 0.5) * 2.6, (rand() - 0.5) * 2.0, (rand() - 0.5) * 2.6),
          wide,
        });
      }
      x += units;
    });
  });
}

/* ---- floating keys (children of the camera, so they sit in view space) ---- */
const floatSets = FLOAT_SETS.map((set, si) => set.map((f, i) => {
  const m = makeKey(f.legend, f.w, floatAlpha, 0.3 + i * 0.37 + si * 0.21);
  m.visible = false; camera.add(m);
  const rand = rng(100 + si * 17 + i);
  return { mesh: m, cfg: f, from: new THREE.Vector3((rand() - 0.5) * 3, -3.2 - rand() * 2, 6.2), ph: rand() * 6.28 };

/* =====================================================================
   5. TYPE OVERLAY  (plain DOM so it stays crisp and editable)
   ===================================================================== */
const el = id => document.getElementById(id);
let chars = [];                                   // headline letters with their timings
function fillLetters(node, text, animated, seedBase, lineDelay) {
  node.textContent = "";
  const rand = rng(seedBase);
  text.split(/(\s+)/).forEach(word => {
    if (!word) return;
    const w = document.createElement("span"); w.className = "wd";
    if (P.slantAI && /^A\.?I\.?$/i.test(word.trim()) && word.trim().length === 2) w.classList.add("slant");
    for (const ch of word) {
      const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; w.appendChild(s);
      if (animated && ch.trim()) chars.push({ node: s, delay: lineDelay + rand() * 1.15, dx: (rand() - 0.35) * 1.1, dy: -(0.35 + rand() * 0.75), last: -1 });
    }
    node.appendChild(w);
  });
}
function buildText() {
  chars = [];
  fillLetters(el("kicker"), P.kicker, true, 11, 0.0);
  const lines = el("lines"); lines.textContent = "";
  [P.line1, P.line2, P.line3].forEach((t, i) => { if (!t) return; const d = document.createElement("div"); d.className = "line"; lines.appendChild(d); fillLetters(d, t, true, 21 + i, 0.1 + i * 0.42); });
  for (const id of ["lockup", "bigtitle"]) {
    const n = el(id); n.textContent = "";
    [P.title1, P.title2].forEach(t => { if (!t) return; const d = document.createElement("div"); n.appendChild(d); fillLetters(d, t, false, 1, 0); });
  }
  const ov = el("overlay");
  ov.style.color = P.textColor; ov.style.fontWeight = P.weight;
  ov.style.display = P.showText ? "" : "none";
  el("headline").style.transformOrigin = "0 0"; el("lockup").style.transformOrigin = "100% 0";
  fitText();
}

/* Type adapts to the format: one unit (--u) grows as the frame gets narrower,
   blocks shift, and anything still too wide is scaled down to fit. */
const fit = { head: 9, lock: 9, big: 9, tall: 0 };
function widest(node) {
  let m = 1;
  node.querySelectorAll("div").forEach(d => { if (d.querySelector(":scope > .wd")) { let w = 0; for (const c of d.children) w += c.offsetWidth; m = Math.max(m, w); } });
  return m;
}
function fitText() {
  const W = stage.clientWidth, H = stage.clientHeight; if (!W || !H) return;
  const narrow = Math.max(1, (16 / 9) / (W / H));           // 1 at 16:9, 3.16 at 9:16
  const wide = Math.min(1, (16 / 9) / (W / H));              // frames wider than 16:9 size type by height instead
  stage.style.setProperty("--u", (W / 100 * wide * Math.pow(narrow, 0.7)) + "px");
  fit.tall = clamp((narrow - 1) / 2.16);
  fit.head = 0.84 * W / widest(el("headline"));
  fit.lock = 0.42 * W / widest(el("lockup"));
  fit.big = 0.88 * W / widest(el("bigtitle"));
  el("headline").style.top = lerp(25.5, 15.5, fit.tall) + "%";
  el("lockup").style.top = lerp(8.2, 4.2, fit.tall) + "%";
  el("bigtitle").style.top = lerp(30, 37, fit.tall) + "%";
}

function updateText(t) {
  const Tt = SEQ.titleAt, end = SEQ.total;         // when the title shots begin, and the loop length
  // headline letters drop into place in a shuffled order
  const tt = (t - 0.3) * P.typeSpeed;
  for (const c of chars) {
    const k = clamp((tt - c.delay) / 0.28);
    if (k === c.last) continue; c.last = k;
    const e = easeOut(k);
    c.node.style.opacity = k > 0 ? 1 : 0;
    c.node.style.transform = k >= 1 ? "" : `translate(${(c.dx * (1 - e)).toFixed(3)}em, ${(c.dy * (1 - e)).toFixed(3)}em)`;
  }
  const s = P.textScale;
  const headOut = ramp(t, Tt - 0.15, Tt + 0.3);
  const head = el("headline");
  head.style.opacity = 1 - headOut; head.style.filter = headOut > 0 && headOut < 1 ? `blur(${(headOut * 0.9).toFixed(2)}cqw)` : "";
  head.style.transform = `scale(${Math.min(s, fit.head).toFixed(4)})`;
  const lock = el("lockup");
  lock.style.opacity = Math.max(1 - ramp(t, Tt - 0.15, Tt + 0.2), ramp(t, end - 0.35, end - 0.05));
  lock.style.transform = `scale(${Math.min(s, fit.lock).toFixed(4)})`;
  const big = el("bigtitle");
  const bin = ramp(t, Tt + 0.1, Tt + 0.55), bout = ramp(t, end - 0.5, end - 0.15);
  big.style.opacity = bin * (1 - bout);
  big.style.filter = bin > 0 && bin < 1 ? `blur(${((1 - bin) * 1.2).toFixed(2)}cqw)` : "";
  big.style.transform = `scale(${(Math.min(s, fit.big) * (1.08 - 0.08 * bin - 0.1 * bout)).toFixed(4)})`;
  // logo row sits low under the headline, and tucks under the big title
  const up = bin * (1 - ramp(t, end - 0.45, end - 0.05));
  el("logos").style.top = lerp(lerp(81.5, 88, fit.tall), lerp(64, 56, fit.tall), up) + "%";
}

/* =====================================================================
   6. ANIMATION  – everything is a pure function of loop time t
   ===================================================================== */
const _p = new THREE.Vector3(), _q = new THREE.Vector3(), _e = new THREE.Euler();
function setCamera(c, k) {

    _p.set(Math.sin(az) * r, lerp(A.h, B.h, e), Math.cos(az) * r);
    _q.set(lerp(A.look[0], B.look[0], e), lerp(A.look[1], B.look[1], e), lerp(A.look[2], B.look[2], e));
  } else {
    _p.set(lerp(A.p[0], B.p[0], e), lerp(A.p[1], B.p[1], e), lerp(A.p[2], B.p[2], e));
    _q.set(lerp(A.q[0], B.q[0], e), lerp(A.q[1], B.q[1], e), lerp(A.q[2], B.q[2], e));

function update(t) {
  // --- uniforms from settings
  for (let i = 0; i < 7; i++) cols[i].set(DEFAULTS["c" + i]).offsetHSL(P.hue / 360, 0, 0);
  shared.uPhase.value = (t / SEQ.total) * Math.PI * 2 * Math.round(P.bgFlow);
  shared.uWarp.value = P.bgWarp;
  bgUniforms.uScale.value = P.bgScale; bgUniforms.uContrast.value = P.bgContrast;
  keyShared.uOpacity.value = P.keyOpacity; keyShared.uPattern.value = P.keyPattern; keyShared.uNormalInf.value = P.keyNormal;
  keyShared.uContrast.value = P.keyContrast; keyShared.uHeat.value = P.keyHeat; keyShared.uTopHeat.value = P.keyTopHeat;
  keyShared.uEdge.value = P.edgeStrength; keyShared.uRim.value = P.rimStrength; keyShared.uLegendOp.value = P.legendOpacity;
  keyShared.uEdgeCol.value.set(P.edgeColor);

  const narrow = Math.max(1, (16 / 9) / camera.aspect);
  const fov = 2 * Math.atan(Math.tan(P.fov * Math.PI / 360) * Math.sqrt(narrow)) * 180 / Math.PI;
  if (Math.abs(camera.fov - fov) > 1e-4) { camera.fov = fov; camera.updateProjectionMatrix(); }
  const halfH = 10 * Math.tan(fov * Math.PI / 360), halfW = halfH * camera.aspect;

  // --- which shot are we in?
  const shots = SEQ.shots; let si = shots.length - 1;

  const shot = shots[si], def = shot.def, next = shots[(si + 1) % shots.length].def;
  const tau = t - shot.start, k = clamp(tau / def.len);            // seconds into the shot, and its progress 0..1
  const single = shots.length === 1;
  bgUniforms.uHeat.value = P.bgHeat + keyed(def.heat, tau) * P.heatAnim;

  // --- keyboard shots
  const boardOn = !!def.cam;
  board.visible = boardOn;
  if (boardOn) {
    setCamera(def.cam, k);
    const scatter = !single && next.float !== undefined;            // next shot is floating keys: the board lifts away
    boardAlpha.value = (def.fadeIn ? ramp(tau, def.fadeIn[0], def.fadeIn[1]) : 1) * (scatter ? 1 - ramp(tau, def.len - 0.3, def.len - 0.02) : 1);
    const B = lerp(def.burst[0], def.burst[1], Math.pow(k, 0.8));
    const exit = scatter ? easeIn((tau - (def.len - 0.5)) / 0.5) : 0;
    const waveX = def.ripple ? lerp(-10.5, 10.5, k) : 0;
    for (const key of boardKeys) {
      const lifted = key.pick < P.burstShare && !key.wide;
      let l = lifted ? Math.max(0, B - key.thr) / (1 - key.thr) : 0;

        c.at[1] * halfH + f.from.y * (1 - arrive) + lt * 0.022 * dr,
        -10 + f.from.z * (1 - arrive));

    ["speed", "Speed", 0, 3, 0.01], ["burstHeight", "Burst height", 0, 6, 0.01], ["burstShare", "Keys that lift", 0, 1, 0.01], ["tumble", "Tumble", 0, 3, 0.01],
    ["floatDrift", "Float drift", 0, 4, 0.01], ["floatScale", "Float size", 0.3, 2, 0.01], ["blur", "Blur", 0, 5, 0.01], ["fov", "Lens", 15, 70, 0.1] ] },
  { name: "Logos", items: [] },
];
function markMusic(id) { P.music = id; document.querySelectorAll("[data-track]").forEach(b => b.classList.toggle("on", b.dataset.track === id)); }
function setMusic(id) {
  if (!Music.set(id)) id = "off";
  P.music = id; soundWanted = id !== "off"; if (id !== "off") lastTrack = id;
  document.querySelectorAll("[data-track]").forEach(b => b.classList.toggle("on", b.dataset.track === id));
}
const REBUILD_TEXT = new Set(["showText", "kicker", "line1", "line2", "line3", "title1", "title2", "textColor", "weight", "slantAI"]);
const refreshers = [];
function hud(name, value, frac) { const h = el("hud"); h.querySelector(".name").textContent = name; h.querySelector(".val").textContent = value; h.querySelector(".bar").style.width = (clamp(frac) * 100) + "%"; }
function refreshControls() { refreshers.forEach(f => f()); }
{
  const tabBar = el("tabs"), panels = el("panels");
  const select = i => { [...tabBar.children].forEach((b, j) => b.setAttribute("aria-selected", j === i)); [...panels.children].forEach((p, j) => p.hidden = j !== i); };
  TABS.forEach((tab, ti) => {
    const btn = document.createElement("button"); btn.textContent = tab.name; btn.setAttribute("role", "tab"); btn.onclick = () => select(ti); tabBar.appendChild(btn);
    const panel = document.createElement("div"); panel.className = "panel"; panel.setAttribute("role", "tabpanel"); panels.appendChild(panel);
    const fields = document.createElement("div"); fields.className = "fields";
    let grid = document.createElement("div"); grid.className = "dials";
    tab.items.forEach(([key, label, a, b, step]) => {
      if (key === "#") {                                    // a group: its own light box, rows of four
        if (grid.children.length) panel.appendChild(grid);
        grid = document.createElement("div"); grid.className = "dials grouped"; grid.setAttribute("role", "group"); grid.setAttribute("aria-label", label); return;
      }
      let mine = null;
      const changed = () => { if (REBUILD_TEXT.has(key)) buildText(); if (key === "shots") { setShots(); refreshControls(); } refreshers.forEach(f => { if (f.key === key && f !== mine) f(); }); };
      const register = show => { show.key = key; mine = show; refreshers.push(show); show(); };
      if (a === "text") {                                   // text stays a plain field
        const wrap = document.createElement("div"), lab = document.createElement("label"), input = document.createElement("input");
        input.type = "text"; input.id = "ctl-" + ti + "-" + key; lab.htmlFor = input.id; lab.textContent = label;
        input.oninput = () => { P[key] = input.value; changed(); };
        wrap.append(lab, input); fields.appendChild(wrap); register(() => { input.value = P[key]; });
        return;
      }
      const d = document.createElement("button"); d.type = "button"; d.className = "dial"; d.id = "ctl-" + ti + "-" + key;
      const name = document.createElement("span"); name.textContent = label; d.appendChild(name);
      const val = document.createElement("span"); val.className = "v"; d.appendChild(val);
      grid.appendChild(d);
      if (a === "bool") {                                   // tap to switch
        d.classList.add("toggle"); d.onclick = () => { P[key] = !P[key]; show(); changed(); };
        const show = () => { val.textContent = P[key] ? "On" : "Off"; d.classList.toggle("on", !!P[key]); }; register(show);
      } else if (a === "color") {                           // tap to pick
        d.classList.add("swatch");
        const chip = document.createElement("span"); chip.className = "chip"; const input = document.createElement("input"); input.type = "color"; input.setAttribute("aria-label", label);
        d.append(chip, input); input.oninput = () => { P[key] = input.value; show(); changed(); };
        const show = () => { input.value = P[key]; val.textContent = P[key]; chip.style.background = P[key]; }; register(show);
      } else {                                              // press, hold and drag sideways
        const fill = document.createElement("span"); fill.className = "fill"; d.appendChild(fill);
        const fmt = v => (+v).toFixed(step >= 1 ? 0 : step >= 0.1 ? 1 : 2);
        const show = () => { val.textContent = fmt(P[key]); fill.style.width = (clamp((P[key] - a) / (b - a)) * 100) + "%"; if (d.classList.contains("active")) hud(label, fmt(P[key]), (P[key] - a) / (b - a)); };
        const set = v => { v = clamp(Math.round(v / step) * step, a, b); if (v !== P[key]) { P[key] = v; show(); changed(); } };
        let startX = 0, startV = 0, held = false;
        d.onpointerdown = ev => { held = true; startX = ev.clientX; startV = P[key]; try { d.setPointerCapture(ev.pointerId); } catch (e) {} d.classList.add("active"); show(); el("hud").classList.add("show"); ev.preventDefault(); };
        d.onpointermove = ev => { if (held) set(startV + (ev.clientX - startX) / Math.min(300, window.innerWidth * 0.7) * (b - a)); };
        const end = () => { if (!held) return; held = false; d.classList.remove("active"); el("hud").classList.remove("show"); };
        d.onpointerup = end; d.onpointercancel = end; d.onlostpointercapture = end;
        d.ondblclick = () => set(DEFAULTS[key]);            // double-tap returns to the default
        d.onkeydown = ev => { const dir = ev.key === "ArrowRight" || ev.key === "ArrowUp" ? 1 : ev.key === "ArrowLeft" || ev.key === "ArrowDown" ? -1 : 0; if (dir) { set(P[key] + dir * step * (ev.shiftKey ? 10 : 1)); ev.preventDefault(); } };
        d.oncontextmenu = ev => ev.preventDefault();
        register(show);
      }
    });
    if (fields.children.length) panel.appendChild(fields);
    if (grid.children.length) panel.appendChild(grid);
    if (tab.name === "Logos") panel.appendChild(el("extras"));
    if (tab.name === "Music") {
      const bar = document.createElement("div"); bar.id = "tracks";
      [["off", "Off"], ["ambient", "Ambient"], ["minimal", "Minimal"], ["jungle", "Jungle"]].forEach(([id, name]) => {
        const b = document.createElement("button"); b.textContent = name; b.dataset.track = id; b.onclick = () => setMusic(id); bar.appendChild(b);
      });
      panel.prepend(bar);
    }
  });
  select(0); markMusic(P.music);
}
// Sound: the default track is cued on load. Browsers hold audio back until the first
// tap, click or key press, so the first one anywhere on the page releases it.
let lastTrack = P.music === "off" ? "ambient" : P.music, soundWanted = P.music !== "off";
function wake() { if (soundWanted && !Music.running) { Music.set(P.music); Music.resume(); } }
try { if (soundWanted) Music.set(P.music); } catch (e) {}
for (const ev of ["click", "touchend", "pointerup", "keydown"]) window.addEventListener(ev, wake, true);

/* ---- logo slots, copy, reset ---- */
function showLogos() {
  const a = el("logoA"), b = el("logoB"), both = !a.hidden && !b.hidden;
  el("logos").classList.toggle("empty", a.hidden && b.hidden);
  el("logos").querySelector(".div").hidden = !both;
}
function bindLogo(inputId, imgId) {
  el(inputId).onchange = ev => { const f = ev.target.files[0]; if (!f) return; const img = el(imgId); img.src = URL.createObjectURL(f); img.hidden = false; showLogos(); };
}
bindLogo("fileA", "logoA"); bindLogo("fileB", "logoB");
el("clearLogos").onclick = () => { for (const id of ["logoA", "logoB"]) { el(id).hidden = true; el(id).removeAttribute("src"); } el("fileA").value = ""; el("fileB").value = ""; showLogos(); };
el("copy").onclick = () => {
  const text = JSON.stringify(P, null, 2), box = el("dump");
  box.value = text; box.style.display = "block"; box.select();
  try { navigator.clipboard.writeText(text).then(() => { el("copy").textContent = "Copied"; setTimeout(() => el("copy").textContent = "Copy settings", 1200); }).catch(() => {}); } catch (e) {}
};
el("reset").onclick = () => { Object.assign(P, DEFAULTS); SEQ = buildSequence(P.shots); head = 0; setAspect(P.aspect); setMusic(P.music); refreshControls(); buildText(); };

/* ---- go ---- */
buildText(); drawAtlas(); setAspect(P.aspect);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawAtlas(); fitText(); });
requestAnimationFrame(tick);
